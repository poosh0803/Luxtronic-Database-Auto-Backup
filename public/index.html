<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxtronic Database Backup</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <img src="images/logo.png" alt="Luxtronic" class="logo-img">
      <span class="brand-name">Luxtronic</span>
      <span class="tagline">Database Backup</span>
    </div>
    <div class="dark-mode-toggle" id="darkModeToggle" title="Toggle dark mode">
      <i class="fas fa-moon" id="themeIcon"></i>
    </div>
  </div>

  <div class="nav-bar">
    <a href="/" class="nav-item active"><i class="fas fa-gauge-high"></i> Dashboard</a>
    <a href="/api/download-zip" class="nav-item" title="Newest backup of every database, as one zip"><i class="fas fa-file-zipper"></i> Download all latest</a>
    <button type="button" class="nav-item nav-item-accent" id="backupAllBtn">
      <i class="fas fa-database"></i> Back up all now
    </button>
  </div>

  <main>
    <h1>Database Backups</h1>
    <p class="subtitle" id="pageSubtitle">Loading&hellip;</p>

    <div id="alerts"></div>

    <div class="stats-grid" id="stats"></div>

    <details class="panel settings-panel" id="settingsPanel">
      <summary><h2><i class="fas fa-sliders"></i> Retention settings</h2></summary>
      <form id="settingsForm" class="settings-form">
        <label>
          <span>Max backups kept per database</span>
          <input type="number" name="maxKeep" min="0" max="1000" step="1" required>
          <small>Older ones are deleted once a database has more than this. 0 = no limit.
            A single database can have its own limit - open its <strong>History</strong>.</small>
        </label>
        <label>
          <span>Delete backups older than (days)</span>
          <input type="number" name="retentionDays" min="0" max="3650" step="1" required>
          <small>0 = never delete by age. The newest <span id="keepMinNote">3</span> of each database are always kept by this rule.</small>
        </label>
        <div class="settings-actions">
          <button type="submit" class="btn btn-primary"><i class="fas fa-floppy-disk"></i> Save</button>
          <button type="button" class="btn" id="settingsReset">Cancel</button>
          <small>Lowering a limit deletes the extra backups straight away - you'll be asked first.</small>
        </div>
      </form>
    </details>

    <div id="targets"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
